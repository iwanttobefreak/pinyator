# Nombre de proyecto distinto al de producción para no colisionar
name: pinyator-dev

services:
  web:
    build: .
    command: flask --app run:application run --debug --host 0.0.0.0 --port 5000
    ports:
      - "127.0.0.1:5050:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - pinyator_dev_data:/app/data
    restart: "no"

volumes:
  pinyator_dev_data:
